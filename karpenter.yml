apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: linuxtips
spec:
  instanceProfile: "linuxtips-cluster"
  amiFamily: "AL2023"
  amiSelectorTerms:
  - id: ami-03571be2203184664
  securityGroupSelectorTerms:
  - id: sg-06900933a94c12415
  subnetSelectorTerms:
  - id: subnet-0b9e7029257220baa
  - id: subnet-0011a675786f5be98
  - id: subnet-0e36c739b204dfa5f
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: linuxtips
spec:
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
  template:
    metadata:
      labels:
        workload: "etc"  
    spec:
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values:   
          - t3
          - t3a

        - key: karpenter.k8s.aws/instance-size
          operator: In
          values:
          - large
          - medium

        - key: karpenter.sh/capacity-type
          operator: In
          values:
          - "spot"
    
        - key: "topology.kubernetes.io/zone" 
          operator: In
          values:
          - "us-east-1a"
          - "us-east-1b"
          - "us-east-1c"          
          
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: linuxtips