apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "chip-helmify.fullname" . }}-chip
  labels:
    app: chip
  {{- include "chip-helmify.labels" . | nindent 4 }}
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: chip
  strategy:
    blueGreen:
      activeService: chip
      autoPromotionEnabled: true
      prePromotionAnalysis:
        templates:
        - templateName: chip-warm-up-operation
        - templateName: chip-success-rate
      previewService: chip-green
      scaleDownDelaySeconds: 30
  template:
    metadata:
      labels:
        app: chip
        name: chip
        version: v17
    spec:
      containers:
      - env:
        - name: CHAOS_MONKEY_ENABLED
          value: "false"
        - name: CHAOS_MONKEY_MODE
          value: critical
        - name: CHAOS_MONKEY_LATENCY
          value: "true"
        - name: CHAOS_MONKEY_EXCEPTION
          value: "true"
        - name: CHAOS_MONKEY_APP_KILLER
          value: "true"
        - name: CHAOS_MONKEY_MEMORY
          value: "true"
        - name: VERSION
          value: v17
        image: fidelissauro/chip:v1
        livenessProbe:
          failureThreshold: 10
          httpGet:
            httpHeaders:
            - name: Custom-Header
              value: Awesome
            path: /liveness
            port: 8080
          periodSeconds: 10
        name: chip
        ports:
        - containerPort: 8080
          name: http
        resources:
          limits:
            cpu: 250m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 512Mi
        startupProbe:
          failureThreshold: 10
          httpGet:
            path: /readiness
            port: 8080
          periodSeconds: 10
      nodeSelector:
        karpenter.sh/nodepool: general
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: chip
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: {{ include "chip-helmify.fullname" . }}-chip
  labels:
  {{- include "chip-helmify.labels" . | nindent 4 }}
spec:
  selector:
    istio: ingressgateway
  servers:
  - hosts:
    - chip.cquinta.com
    port:
      name: http
      number: 80
      protocol: HTTP
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ include "chip-helmify.fullname" . }}-chip
  labels:
  {{- include "chip-helmify.labels" . | nindent 4 }}
spec:
  gateways:
  - chip
  hosts:
  - chip.chip.svc.cluster.local
  - chip.cquinta.com
  http:
  - retries:
      attempts: 1
      perTryTimeout: 10500ms
      retryOn: connect-failure,refused-stream
    route:
    - destination:
        host: chip
        port:
          number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chip-helmify.fullname" . }}-chip
  labels:
  {{- include "chip-helmify.labels" . | nindent 4 }}
spec:
  type: {{ .Values.chip.type }}
  selector:
    app: chip
    {{- include "chip-helmify.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.chip.ports | toYaml | nindent 2 }}
