apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ include "chip-helmify.fullname" . }}-green
  labels:
  {{- include "chip-helmify.labels" . | nindent 4 }}
spec:
  gateways:
  - chip
  hosts:
  - chip-green.chip.svc.cluster.local
  - chip-green.cquinta.com
  http:
  - retries:
      attempts: 3
      perTryTimeout: 10500ms
      retryOn: 5xx
    route:
    - destination:
        host: chip-green
        port:
          number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chip-helmify.fullname" . }}-green
  labels:
  {{- include "chip-helmify.labels" . | nindent 4 }}
spec:
  type: {{ .Values.green.type }}
  selector:
    app: chip
    {{- include "chip-helmify.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.green.ports | toYaml | nindent 2 }}
