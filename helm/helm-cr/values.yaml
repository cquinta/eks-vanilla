app:
  name: cr
  namespace: cr
  image:
    repository: nginx
    tag: latest
    pullPolicy: IfNotPresent
  createNamespace: true
  iam: ""


  capacity:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
    autoscaling:
      min: 4
      max: 20

    nodepool:
      enabled: true
      name: general

  probes:
    startupProbe:
      enabled: true
      failureThreshold: 10
      periodSeconds: 10
      httpGet:
        path: /
        port: 80
    readinessProbe:
      enabled: true
      failureThreshold: 10
      periodSeconds: 10
      httpGet:
        path: /
        port: 80    
    livenessProbe:
      enabled: true
      failureThreshold: 10
      periodSeconds: 10
      httpGet:
        path: /
        port: 80

  envs:
    - name: ENV
      value: "dev"
    - name: FOO
      value: "bar"
    - name: VERSION
      value: v10

  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443

  istio:
    host: cr.cquinta.com
    gateway:
      enabled: true
      protocol: HTTP
      port: 80

    virtualService:
      enabled: true
      http:
        enabled: true
        port: 80
        retries:
          attempts: 1
          perTryTimeout: 2s
          retryOn: 5xx
  
  rollout:
    revisionHistoryLimit: 3
    version: v1
    strategy:
      canary:
        enabled: true
        steps:
          - setWeight: 20
          - pause: {duration: 30s}
          - analysis:
              templates:
                - templateName: istio-success
          - setWeight: 40
          - pause: {duration: 30s}
          - setWeight: 60
          - pause: {duration: 30s}
          - setWeight: 80
          - pause: {duration: 30s}
          - setWeight: 100    

    analysisTemplates:
    - name: 'istio-success'
      spec:
        metrics:
        - name: success-rate
          interval: 2m
          failureLimit: 0
          successCondition: result[0] >= 0.95
          count: 1
          provider:
            prometheus:
              address: http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090
              query: |
                sum(irate(
                  istio_requests_total{destination_service=~"cr.cr.svc.cluster.local",response_code!~"5.*"}[1m]
                )) /
                sum(irate(
                  istio_requests_total{destination_service=~"cr.cr.svc.cluster.local"}[1m]
                ))
  
  
  prometheus:
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
      port: http
      path: /metrics
  
  keda: 
    enabled: true
    hpaConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 20
        scaleUp:
          stabilizationWindowSeconds: 20
      cooldownPeriod: 30
      pollingInterval: 10

    prometheus:
    # - name: keda-scale-tps
    #   metricName: istio_requests_total
    #   query: "sum(rate(istio_requests_total{destination_service_name=\"cr\"}[1m]))"
    #   serverAddress: http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090
    #   threshold: "10"
     
    cron:
    # - name: scale-up
    #   start: 40 14 * * *       
    #   end: 40 18 * * *         
    #   timezone: "America/Sao_Paulo"
    #   desiredReplicas: 20

    memory:
    # - name: memory-high
    #   metricType: Utilization
    #   threshold: 80
    sqs:
    # - name: queue-high
    #   metricType: Utilization
    #   awsRegion: us-east-1
    #   queueURL: https://sqs.us-east-1.amazonaws.com/123456789012/MyQueue
    #   queueLength: 50

    cpu:
    - name: cpu-high
      metricType: Utilization
      threshold: 80